<svg viewBox="0 0 320 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-attn" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="320" height="520" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="160" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Scaled Dot-Product Attention</text>

  <!-- Input boxes: Q, K, V -->
  <rect x="30" y="56" width="70" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="65" y="79" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Q</text>

  <rect x="125" y="56" width="70" height="36" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="160" y="79" text-anchor="middle" font-size="13" font-weight="600" fill="#9d174d">K</text>

  <rect x="220" y="56" width="70" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="255" y="79" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">V</text>

  <!-- Arrows from Q and K to MatMul -->
  <line x1="65" y1="92" x2="65" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-attn)"/>
  <line x1="160" y1="92" x2="160" y2="118" stroke="#64748b" stroke-width="1.5"/>
  <line x1="160" y1="118" x2="112" y2="118" stroke="#64748b" stroke-width="1.5"/>
  <line x1="112" y1="118" x2="112" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-attn)"/>

  <!-- MatMul QK^T -->
  <rect x="38" y="132" width="100" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="88" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">MatMul (QK&#x1D40;)</text>

  <!-- Arrow to Scale -->
  <line x1="88" y1="168" x2="88" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-attn)"/>

  <!-- Scale -->
  <rect x="38" y="202" width="100" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="88" y="225" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">Scale (&#xF7; &#x221A;d&#x2096;)</text>

  <!-- Arrow to Mask -->
  <line x1="88" y1="238" x2="88" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-attn)"/>

  <!-- Mask (optional) -->
  <rect x="28" y="272" width="120" height="36" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="88" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Mask (optional)</text>

  <!-- Mask annotation -->
  <text x="168" y="286" font-size="10" fill="#94a3b8" font-style="italic">causal: set future to -inf</text>
  <text x="168" y="300" font-size="10" fill="#94a3b8" font-style="italic">padding: set pad to -inf</text>

  <!-- Arrow to Softmax -->
  <line x1="88" y1="308" x2="88" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-attn)"/>

  <!-- Softmax -->
  <rect x="38" y="342" width="100" height="36" rx="6" fill="#fae8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="88" y="365" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">Softmax</text>

  <!-- Softmax annotation -->
  <text x="156" y="365" font-size="10" fill="#94a3b8" font-style="italic">rows sum to 1</text>

  <!-- Arrow to MatMul with V -->
  <line x1="88" y1="378" x2="88" y2="410" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-attn)"/>

  <!-- V arrow down to MatMul -->
  <line x1="255" y1="92" x2="255" y2="400" stroke="#64748b" stroke-width="1.5"/>
  <line x1="255" y1="400" x2="160" y2="400" stroke="#64748b" stroke-width="1.5"/>
  <line x1="160" y1="400" x2="160" y2="410" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-attn)"/>

  <!-- MatMul with V -->
  <rect x="48" y="412" width="136" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="116" y="435" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">MatMul (weights &#xD7; V)</text>

  <!-- Arrow to Output -->
  <line x1="116" y1="448" x2="116" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-attn)"/>

  <!-- Output -->
  <rect x="66" y="472" width="100" height="36" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="116" y="495" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Output</text>
</svg>