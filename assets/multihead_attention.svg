<svg viewBox="0 0 520 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-mha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="520" height="480" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="260" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Multi-Head Attention</text>

  <!-- Input x -->
  <rect x="210" y="50" width="100" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="260" y="71" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">x (batch, seq, d)</text>

  <!-- Linear projections -->
  <line x1="230" y1="82" x2="100" y2="112" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-mha)"/>
  <line x1="260" y1="82" x2="260" y2="112" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-mha)"/>
  <line x1="290" y1="82" x2="420" y2="112" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-mha)"/>

  <rect x="48" y="114" width="104" height="30" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="100" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Linear W_Q</text>

  <rect x="208" y="114" width="104" height="30" rx="5" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/>
  <text x="260" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#9d174d">Linear W_K</text>

  <rect x="368" y="114" width="104" height="30" rx="5" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
  <text x="420" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">Linear W_V</text>

  <!-- Reshape/Split annotation -->
  <line x1="100" y1="144" x2="100" y2="168" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-mha)"/>
  <line x1="260" y1="144" x2="260" y2="168" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-mha)"/>
  <line x1="420" y1="144" x2="420" y2="168" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-mha)"/>

  <rect x="30" y="170" width="140" height="26" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="100" y="188" text-anchor="middle" font-size="10" fill="#475569">reshape to (b, h, s, d/h)</text>

  <rect x="190" y="170" width="140" height="26" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="260" y="188" text-anchor="middle" font-size="10" fill="#475569">reshape to (b, h, s, d/h)</text>

  <rect x="350" y="170" width="140" height="26" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="420" y="188" text-anchor="middle" font-size="10" fill="#475569">reshape to (b, h, s, d/h)</text>

  <!-- Parallel attention heads -->
  <line x1="100" y1="196" x2="100" y2="220" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-mha)"/>
  <line x1="260" y1="196" x2="260" y2="220" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-mha)"/>
  <line x1="420" y1="196" x2="420" y2="220" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-mha)"/>

  <!-- Head boxes -->
  <rect x="40" y="222" width="440" height="120" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="260" y="244" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Parallel across h heads (batched via reshape, no loop)</text>

  <!-- Individual heads -->
  <rect x="60" y="258" width="100" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="110" y="275" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Head 1</text>
  <text x="110" y="290" text-anchor="middle" font-size="9" fill="#92400e">softmax(QK&#x1D40;/&#x221A;d)V</text>

  <rect x="180" y="258" width="100" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="230" y="275" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Head 2</text>
  <text x="230" y="290" text-anchor="middle" font-size="9" fill="#92400e">softmax(QK&#x1D40;/&#x221A;d)V</text>

  <text x="320" y="282" text-anchor="middle" font-size="16" fill="#64748b">...</text>

  <rect x="350" y="258" width="110" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="405" y="275" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Head h</text>
  <text x="405" y="290" text-anchor="middle" font-size="9" fill="#92400e">softmax(QK&#x1D40;/&#x221A;d)V</text>

  <!-- Arrows to concat -->
  <line x1="110" y1="298" x2="110" y2="350" stroke="#64748b" stroke-width="1.2"/>
  <line x1="230" y1="298" x2="230" y2="350" stroke="#64748b" stroke-width="1.2"/>
  <line x1="405" y1="298" x2="405" y2="350" stroke="#64748b" stroke-width="1.2"/>
  <line x1="110" y1="350" x2="260" y2="370" stroke="#64748b" stroke-width="1.2"/>
  <line x1="230" y1="350" x2="260" y2="370" stroke="#64748b" stroke-width="1.2"/>
  <line x1="405" y1="350" x2="260" y2="370" stroke="#64748b" stroke-width="1.2"/>

  <!-- Concat -->
  <rect x="190" y="362" width="140" height="30" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="260" y="382" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">Concat (reshape back)</text>

  <!-- Arrow to W_O -->
  <line x1="260" y1="392" x2="260" y2="410" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-mha)"/>

  <!-- W_O projection -->
  <rect x="190" y="412" width="140" height="30" rx="5" fill="#fae8ff" stroke="#a855f7" stroke-width="1.2"/>
  <text x="260" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="#6b21a8">Linear W_O</text>

  <!-- Arrow to output -->
  <line x1="260" y1="442" x2="260" y2="458" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-mha)"/>

  <!-- Output -->
  <rect x="200" y="460" width="120" height="28" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
  <text x="260" y="479" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">(batch, seq, d_model)</text>
</svg>