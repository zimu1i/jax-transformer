<svg viewBox="0 0 700 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-full" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="700" height="680" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="350" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Encoder-Decoder Transformer (full architecture)</text>

  <!-- ============ ENCODER SIDE (LEFT) ============ -->
  <text x="190" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">ENCODER</text>

  <!-- Source input -->
  <rect x="110" y="76" width="160" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="190" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">Source tokens ("hola")</text>

  <!-- Token embedding -->
  <line x1="190" y1="106" x2="190" y2="122" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-full)"/>
  <rect x="105" y="124" width="170" height="28" rx="5" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
  <text x="190" y="143" text-anchor="middle" font-size="10" font-weight="600" fill="#c2410c">Token Embedding (src_vocab, d)</text>

  <!-- + Position -->
  <line x1="190" y1="152" x2="190" y2="164" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-full)"/>
  <circle cx="190" cy="172" r="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="190" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">+</text>
  <text x="220" y="168" font-size="9" fill="#94a3b8">positional</text>
  <text x="220" y="180" font-size="9" fill="#94a3b8">embedding</text>

  <!-- Encoder block stack -->
  <line x1="190" y1="182" x2="190" y2="200" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-full)"/>

  <!-- Encoder block 1 -->
  <rect x="80" y="202" width="220" height="120" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Encoder Block (x N)</text>

  <rect x="110" y="232" width="160" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="190" y="249" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">Self-Attention (bidirectional)</text>

  <rect x="110" y="260" width="160" height="20" rx="4" fill="#fae8ff" stroke="#a855f7" stroke-width="0.8"/>
  <text x="190" y="274" text-anchor="middle" font-size="8" fill="#6b21a8">LayerNorm + Residual</text>

  <rect x="110" y="284" width="160" height="24" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="190" y="301" text-anchor="middle" font-size="9" font-weight="600" fill="#065f46">Feed-Forward Network</text>

  <rect x="110" y="312" width="160" height="20" rx="4" fill="#fae8ff" stroke="#a855f7" stroke-width="0.8"/>
  <text x="190" y="326" text-anchor="middle" font-size="8" fill="#6b21a8">LayerNorm + Residual</text>

  <!-- Padding mask into encoder -->
  <rect x="12" y="258" width="56" height="40" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="40" y="275" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">padding</text>
  <text x="40" y="287" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">mask</text>
  <line x1="68" y1="278" x2="108" y2="246" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-full)"/>

  <!-- Encoder output -->
  <line x1="190" y1="322" x2="190" y2="350" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-full)"/>
  <rect x="115" y="352" width="150" height="28" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
  <text x="190" y="371" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">encoder_out</text>

  <!-- Arrow from encoder_out to decoder cross-attention -->
  <line x1="300" y1="366" x2="395" y2="366" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="348" y="360" text-anchor="middle" font-size="9" font-weight="600" fill="#f97316">K, V</text>

  <!-- ============ DECODER SIDE (RIGHT) ============ -->
  <text x="510" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#9d174d">DECODER</text>

  <!-- Target input -->
  <rect x="420" y="76" width="180" height="30" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/>
  <text x="510" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#9d174d">Target tokens (&lt;bos&gt; "hello")</text>

  <!-- Token embedding -->
  <line x1="510" y1="106" x2="510" y2="122" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-full)"/>
  <rect x="425" y="124" width="170" height="28" rx="5" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
  <text x="510" y="143" text-anchor="middle" font-size="10" font-weight="600" fill="#c2410c">Token Embedding (tgt_vocab, d)</text>

  <!-- + Position -->
  <line x1="510" y1="152" x2="510" y2="164" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-full)"/>
  <circle cx="510" cy="172" r="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="510" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">+</text>
  <text x="540" y="168" font-size="9" fill="#94a3b8">positional</text>
  <text x="540" y="180" font-size="9" fill="#94a3b8">embedding</text>

  <!-- Decoder block stack -->
  <line x1="510" y1="182" x2="510" y2="200" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-full)"/>

  <rect x="398" y="202" width="224" height="190" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="510" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#9d174d">Decoder Block (x N)</text>

  <!-- Causal self-attention -->
  <rect x="420" y="232" width="180" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="510" y="249" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">Causal Self-Attention</text>

  <rect x="420" y="260" width="180" height="18" rx="4" fill="#fae8ff" stroke="#a855f7" stroke-width="0.8"/>
  <text x="510" y="273" text-anchor="middle" font-size="8" fill="#6b21a8">LayerNorm + Residual</text>

  <!-- Cross-attention -->
  <rect x="420" y="282" width="180" height="28" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/>
  <text x="510" y="297" text-anchor="middle" font-size="9" font-weight="600" fill="#9d174d">Cross-Attention</text>
  <text x="510" y="307" text-anchor="middle" font-size="8" fill="#9d174d">Q=decoder, K/V=encoder</text>

  <rect x="420" y="314" width="180" height="18" rx="4" fill="#fae8ff" stroke="#a855f7" stroke-width="0.8"/>
  <text x="510" y="327" text-anchor="middle" font-size="8" fill="#6b21a8">LayerNorm + Residual</text>

  <!-- FFN -->
  <rect x="420" y="336" width="180" height="24" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="510" y="353" text-anchor="middle" font-size="9" font-weight="600" fill="#065f46">Feed-Forward Network</text>

  <rect x="420" y="364" width="180" height="18" rx="4" fill="#fae8ff" stroke="#a855f7" stroke-width="0.8"/>
  <text x="510" y="377" text-anchor="middle" font-size="8" fill="#6b21a8">LayerNorm + Residual</text>

  <!-- Causal mask label -->
  <rect x="626" y="232" width="56" height="40" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="654" y="249" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">causal</text>
  <text x="654" y="261" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">mask</text>
  <line x1="626" y1="252" x2="602" y2="246" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-full)"/>

  <!-- Decoder output flow -->
  <line x1="510" y1="392" x2="510" y2="420" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-full)"/>

  <!-- Final LayerNorm -->
  <rect x="440" y="422" width="140" height="28" rx="5" fill="#fae8ff" stroke="#a855f7" stroke-width="1.2"/>
  <text x="510" y="441" text-anchor="middle" font-size="11" font-weight="600" fill="#6b21a8">Final LayerNorm</text>

  <!-- Linear projection -->
  <line x1="510" y1="450" x2="510" y2="470" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-full)"/>
  <rect x="420" y="472" width="180" height="34" rx="5" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
  <text x="510" y="490" text-anchor="middle" font-size="10" font-weight="600" fill="#c2410c">Linear (tgt_emb&#x1D40;, weight tying)</text>
  <text x="510" y="502" text-anchor="middle" font-size="8" fill="#c2410c">reuses target token embedding table</text>

  <!-- Softmax / Output -->
  <line x1="510" y1="506" x2="510" y2="526" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-full)"/>
  <rect x="440" y="528" width="140" height="28" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="510" y="547" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Logits (tgt_vocab)</text>

  <!-- Greedy decode annotation -->
  <line x1="510" y1="556" x2="510" y2="574" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-full)"/>
  <rect x="430" y="576" width="160" height="28" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="510" y="594" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">argmax -> next token</text>

  <!-- Bottom annotation -->
  <text x="350" y="640" text-anchor="middle" font-size="11" fill="#64748b">Paper: "Attention Is All You Need" (Vaswani et al., 2017)</text>
  <text x="350" y="658" text-anchor="middle" font-size="10" fill="#94a3b8">Implementation: character-level Spanish-to-English translation</text>
  <text x="350" y="672" text-anchor="middle" font-size="10" fill="#94a3b8">All attention, embeddings, and training written from scratch in JAX/Flax</text>
</svg>