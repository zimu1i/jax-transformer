<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-tp" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="640" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Training Pipeline: Target Shifting</text>

  <!-- Raw pair -->
  <text x="30" y="68" font-size="11" font-weight="600" fill="#475569">Raw pair:</text>
  <rect x="110" y="52" width="130" height="28" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="175" y="71" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">src: "hola"</text>
  <rect x="260" y="52" width="130" height="28" rx="5" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/>
  <text x="325" y="71" text-anchor="middle" font-size="11" font-weight="600" fill="#9d174d">tgt: "hello"</text>

  <!-- Arrow down -->
  <line x1="230" y1="80" x2="230" y2="104" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-tp)"/>
  <text x="260" y="98" font-size="9" fill="#94a3b8">tokenize + pad</text>

  <!-- Source encoding -->
  <text x="30" y="128" font-size="11" font-weight="600" fill="#475569">Encoder input:</text>
  <g transform="translate(140, 112)">
    <rect x="0" y="0" width="28" height="24" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="14" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">h</text>
    <rect x="30" y="0" width="28" height="24" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="44" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">o</text>
    <rect x="60" y="0" width="28" height="24" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="74" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">l</text>
    <rect x="90" y="0" width="28" height="24" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="104" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">a</text>
    <rect x="120" y="0" width="36" height="24" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="138" y="16" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">eos</text>
    <rect x="158" y="0" width="36" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="176" y="16" text-anchor="middle" font-size="8" fill="#94a3b8">pad</text>
    <rect x="196" y="0" width="36" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="214" y="16" text-anchor="middle" font-size="8" fill="#94a3b8">pad</text>
  </g>

  <!-- Target shift explanation -->
  <line x1="230" y1="142" x2="230" y2="168" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-tp)"/>

  <!-- Decoder input (shifted right) -->
  <text x="30" y="188" font-size="11" font-weight="600" fill="#475569">Decoder input:</text>
  <g transform="translate(140, 172)">
    <rect x="0" y="0" width="36" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="18" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">bos</text>
    <rect x="38" y="0" width="28" height="24" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="52" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#9d174d">h</text>
    <rect x="68" y="0" width="28" height="24" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="82" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#9d174d">e</text>
    <rect x="98" y="0" width="28" height="24" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="112" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#9d174d">l</text>
    <rect x="128" y="0" width="28" height="24" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="142" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#9d174d">l</text>
    <rect x="158" y="0" width="28" height="24" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="172" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#9d174d">o</text>
    <rect x="188" y="0" width="36" height="24" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="206" y="16" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">eos</text>
  </g>
  <text x="380" y="188" font-size="9" fill="#94a3b8" font-style="italic">tgt_batch[:, :-1]</text>

  <!-- Target labels -->
  <text x="30" y="238" font-size="11" font-weight="600" fill="#475569">Target labels:</text>
  <g transform="translate(140, 222)">
    <rect x="0" y="0" width="28" height="24" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="14" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#9d174d">h</text>
    <rect x="30" y="0" width="28" height="24" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="44" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#9d174d">e</text>
    <rect x="60" y="0" width="28" height="24" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="74" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#9d174d">l</text>
    <rect x="90" y="0" width="28" height="24" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="104" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#9d174d">l</text>
    <rect x="120" y="0" width="28" height="24" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="134" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#9d174d">o</text>
    <rect x="150" y="0" width="36" height="24" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="168" y="16" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">eos</text>
    <rect x="188" y="0" width="36" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="206" y="16" text-anchor="middle" font-size="8" fill="#94a3b8">pad</text>
  </g>
  <text x="380" y="238" font-size="9" fill="#94a3b8" font-style="italic">tgt_batch[:, 1:]</text>

  <!-- Arrows showing the shift -->
  <g opacity="0.6">
    <line x1="158" y1="196" x2="158" y2="222" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-tp)"/>
    <line x1="190" y1="196" x2="182" y2="222" stroke="#ec4899" stroke-width="1" marker-end="url(#arrow-tp)"/>
    <line x1="220" y1="196" x2="212" y2="222" stroke="#ec4899" stroke-width="1" marker-end="url(#arrow-tp)"/>
    <line x1="252" y1="196" x2="244" y2="222" stroke="#ec4899" stroke-width="1" marker-end="url(#arrow-tp)"/>
    <line x1="282" y1="196" x2="272" y2="222" stroke="#ec4899" stroke-width="1" marker-end="url(#arrow-tp)"/>
    <line x1="312" y1="196" x2="302" y2="222" stroke="#ec4899" stroke-width="1" marker-end="url(#arrow-tp)"/>
  </g>

  <!-- Explanation box -->
  <rect x="420" y="150" width="200" height="106" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
  <text x="520" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Teacher forcing</text>
  <text x="520" y="186" text-anchor="middle" font-size="9" fill="#166534">At each position, the model</text>
  <text x="520" y="200" text-anchor="middle" font-size="9" fill="#166534">sees ground-truth tokens to</text>
  <text x="520" y="214" text-anchor="middle" font-size="9" fill="#166534">the left and predicts the next.</text>
  <text x="520" y="232" text-anchor="middle" font-size="9" fill="#166534">Causal mask prevents the</text>
  <text x="520" y="246" text-anchor="middle" font-size="9" fill="#166534">decoder from seeing the future.</text>

  <!-- Special token legend -->
  <text x="50" y="280" font-size="11" font-weight="600" fill="#475569">Special tokens:</text>
  <rect x="160" y="268" width="36" height="20" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="178" y="282" text-anchor="middle" font-size="8" fill="#94a3b8">pad</text>
  <text x="206" y="282" font-size="9" fill="#64748b">= 0</text>

  <rect x="240" y="268" width="36" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="258" y="282" text-anchor="middle" font-size="8" font-weight="600" fill="#92400e">bos</text>
  <text x="286" y="282" font-size="9" fill="#64748b">= 1</text>

  <rect x="316" y="268" width="36" height="20" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="334" y="282" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">eos</text>
  <text x="362" y="282" font-size="9" fill="#64748b">= 2</text>

  <rect x="400" y="268" width="50" height="20" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="425" y="282" text-anchor="middle" font-size="8" font-weight="600" fill="#9d174d">char</text>
  <text x="460" y="282" font-size="9" fill="#64748b">= 3+</text>

  <!-- Loss -->
  <text x="320" y="318" text-anchor="middle" font-size="10" fill="#64748b">Loss = cross_entropy(model(src, decoder_input), target_labels)</text>
  <text x="320" y="334" text-anchor="middle" font-size="10" fill="#64748b">Gradients via jax.value_and_grad, optimizer via optax.adam</text>
</svg>